apply plugin: 'com.android.application'

// PathSense SDK v5.0.0.0 is provided privately to licensees.
// Place pathsense-android-5.0.0.0.aar into this module's libs/ folder.
repositories {
    flatDir { dirs 'libs' }
}

android {
    // Updated for PathSense SDK 5.0.0.0 — Android 16 (API 36)
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.pathsense.invehiclelocationdemo.app"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Obtain the AAR privately from PathSense
    implementation(name:'pathsense-android-5.0.0.0', ext:'aar')

    // Modern AndroidX and Play Services libraries
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation "com.google.android.gms:play-services-maps:19.0.0"
    implementation "com.google.android.gms:play-services-location:21.3.0"
}